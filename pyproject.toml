[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careguide-ai-demo"
version = "0.1.0"
description = "UNVALIDATED educational safety-first symptom triage architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.6,<3", "PyYAML>=6.0,<7", "pandas>=2.0,<3",
  "streamlit>=1.36,<2", "anthropic>=0.60,<3", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=4,<8", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live_api: requires real Anthropic credentials, network, and explicit opt-in", "ui: requires installed Streamlit"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
